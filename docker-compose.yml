services:
  redis:
    image: redis:7-alpine
    container_name: membrane-redis
    # Redis listens only on the internal network; no host port exposure.
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Resource caps prevent a runaway Redis from starving the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256
    # Redis is internal-only; no ingress from the host network.
    networks:
      membrane-internal:
        internal: true
    restart: unless-stopped

  membrane:
    build:
      context: .
      dockerfile: Dockerfile
    image: membrane:latest
    container_name: membrane-server
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
      - "50051"
    environment:
      - MEMBRANE_LOG_LEVEL=INFO
      - MEMBRANE_REDIS_URL=redis://redis:6379/0
      - MEMBRANE_NODE_ID=membrane-0
      - MEMBRANE_TRANSPORT=http
      - MEMBRANE_COMPUTE=cpu
      - MEMBRANE_PORT=8080
    command: >
      membrane serve
      --node-id ${MEMBRANE_NODE_ID:-membrane-0}
      --host 0.0.0.0
      --port ${MEMBRANE_PORT:-8080}
      --transport ${MEMBRANE_TRANSPORT:-http}
      --compute ${MEMBRANE_COMPUTE:-cpu}
      --redis ${MEMBRANE_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - membrane-logs:/var/log/membrane
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
          pids: 1024
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - membrane-internal
      - membrane-public

  nginx:
    image: nginx:alpine
    container_name: membrane-nginx
    depends_on:
      - membrane
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - membrane-public

  membrane-tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: membrane:latest
    container_name: membrane-tests
    depends_on:
      - redis
    command: ["pytest", "tests/", "-q", "--tb=short"]
    profiles:
      - test
    environment:
      - MEMBRANE_LOG_LEVEL=WARNING
    networks:
      - membrane-internal

volumes:
  redis-data:
  membrane-logs:

networks:
  membrane-internal:
    driver: bridge
    internal: true
  membrane-public:
    driver: bridge
