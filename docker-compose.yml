# Single-node Membrane behind an nginx TLS edge, with Redis persistence.
#
# Before `docker compose up`:
#   1. Create an API key. The first line printed is the key (keep it for
#      clients); the second, hashed line goes in the keyfile:
#        docker compose build membrane
#        docker run --rm membrane:latest membrane keys generate --subject ops --scope admin
#        mkdir -p deployment/secrets
#        echo 'sha256:<digest>:ops:admin' > deployment/secrets/api-keys
#        chmod 600 deployment/secrets/api-keys
#      The server refuses a keyfile other users can read. On Linux the
#      container's user (uid 1000) must own it: sudo chown 1000 <file>.
#   2. Provide a TLS certificate for nginx:
#        mkdir -p deployment/nginx/ssl
#        openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj /CN=localhost \
#          -keyout deployment/nginx/ssl/membrane.key -out deployment/nginx/ssl/membrane.crt
# Both directories are git-ignored.

services:
  redis:
    image: redis:7-alpine
    container_name: membrane-redis
    # Redis listens only on the internal network; no host port exposure.
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Resource caps prevent a runaway Redis from starving the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256
    networks:
      - membrane-internal
    restart: unless-stopped

  membrane:
    build:
      context: .
      dockerfile: Dockerfile
    image: membrane:latest
    container_name: membrane-server
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      MEMBRANE_NODE_ID: ${MEMBRANE_NODE_ID:-membrane-0}
      MEMBRANE_LOG_LEVEL: ${MEMBRANE_LOG_LEVEL:-INFO}
      MEMBRANE_LOG_FORMAT: json
      MEMBRANE_COMPUTE: ${MEMBRANE_COMPUTE:-cpu}
      MEMBRANE_REDIS_URL: redis://redis:6379/0
      MEMBRANE_API_KEY_FILE: /run/secrets/membrane_api_keys
      # KV bytes on disk + fragment metadata in Redis: survives restarts.
      MEMBRANE_DATA_DIR: /var/lib/membrane
      # SIGTERM drains within this budget; stop_grace_period is longer.
      MEMBRANE_DRAIN_TIMEOUT: "30"
      MEMBRANE_MAX_CONCURRENCY: "64"
    volumes:
      - membrane-data:/var/lib/membrane
    secrets:
      - membrane_api_keys
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
          pids: 1024
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - membrane-internal
      - membrane-public

  nginx:
    image: nginx:alpine
    container_name: membrane-nginx
    depends_on:
      - membrane
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - membrane-public

secrets:
  membrane_api_keys:
    file: ./deployment/secrets/api-keys

volumes:
  redis-data:
  membrane-data:

networks:
  # No route to the outside world: Redis is reachable only from membrane.
  membrane-internal:
    driver: bridge
    internal: true
  membrane-public:
    driver: bridge
