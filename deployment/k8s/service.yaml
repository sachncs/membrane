---
# Headless Service: gives each pod its own stable DNS name
# (membrane-0.membrane-headless.<namespace>.svc.cluster.local). The
# cluster layer uses these for seed and peer addressing.
apiVersion: v1
kind: Service
metadata:
  name: membrane-headless
  labels:
    app: membrane
spec:
  clusterIP: None
  # Peers must resolve each other while bootstrapping, before they
  # report ready.
  publishNotReadyAddresses: true
  selector:
    app: membrane
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Client Service: round-robin load balancing.
apiVersion: v1
kind: Service
metadata:
  name: membrane
  labels:
    app: membrane
spec:
  selector:
    app: membrane
  ports:
    - name: http
      port: 80
      targetPort: http
