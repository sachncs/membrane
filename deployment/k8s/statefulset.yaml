---
# Membrane server — StatefulSet for stable pod identity.
# 3 replicas by default; each pod has a stable hostname (membrane-0,
# membrane-1, membrane-2) that the cluster layer uses for gossip addressing.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: membrane
  labels:
    app: membrane
spec:
  replicas: 3
  serviceName: membrane-headless
  selector:
    matchLabels:
      app: membrane
  template:
    metadata:
      labels:
        app: membrane
    spec:
      # Covers the server's graceful shutdown on SIGTERM.
      terminationGracePeriodSeconds: 45
      # Spread replicas across nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: membrane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: membrane
          image: ghcr.io/sachncs/membrane:v3.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: membrane-config
          env:
            - name: MEMBRANE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Address peers dial; the bind address 0.0.0.0 is not routable.
            - name: MEMBRANE_ADVERTISE_HOST
              value: "$(MEMBRANE_NODE_ID).membrane-headless.$(POD_NAMESPACE).svc.cluster.local"
            - name: MEMBRANE_API_KEY_FILE
              value: /run/secrets/membrane/api-keys
            - name: MEMBRANE_PEER_API_KEY_FILE
              value: /run/secrets/membrane/peer-api-key
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          # Readiness: deep check via /readyz.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness: shallow check via /livez.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          # Startup probe gives the cluster 60s to converge before
          # liveness kicks in.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/membrane
              readOnly: true
            # readOnlyRootFilesystem: the TLS listener writes its PEMs here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: membrane-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
