---
# NetworkPolicy: default-deny + explicit allowlist. Pods accept HTTP from
# the ingress controller, Prometheus, and each other; they may reach DNS,
# Redis, and their peers. Adjust the namespace labels to your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: membrane
spec:
  podSelector:
    matchLabels:
      app: membrane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # Peer traffic: join, heartbeat, gossip, replicate.
        - podSelector:
            matchLabels:
              app: membrane
  egress:
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector: {}
    # Redis.
    - ports:
        - port: 6379
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: redis
    # Peers.
    - ports:
        - port: 8080
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: membrane
