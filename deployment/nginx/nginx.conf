# Membrane reverse proxy. Listens on port 80 (redirect to 443) and 443 (TLS).
# Rate limit and security headers are enforced at the edge so the application
# stays focused on business logic.

# Connection limit (per client IP) for the rate-limit zone.
limit_req_zone $binary_remote_addr zone=membrane:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=membrane_conn:10m;

upstream membrane_backend {
    server membrane:8080;
    keepalive 32;
}

# Plain HTTP — redirect to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS — terminates TLS, forwards to the application backend.
server {
    listen 443 ssl http2;
    server_name _;

    # TLS configuration. Provide a real certificate and key in production;
    # self-signed is acceptable for local development.
    ssl_certificate     /etc/nginx/ssl/membrane.crt;
    ssl_certificate_key /etc/nginx/ssl/membrane.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow up to 100 MiB bodies (matches DEFAULT_MAX_BODY_BYTES in app).
    client_max_body_size 100M;

    # Timeouts.
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_buffers         4 32k;
    proxy_buffer_size     16k;

    # Rate limit: 10 r/s with burst 20.
    limit_req  zone=membrane burst=20 nodelay;
    limit_conn zone=membrane_conn 50;

    # Security headers — apply to every response.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'" always;

    # gzip compression.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # Health probes — bypass rate limit so orchestrators can probe freely.
    location ~* ^/(livez|readyz|heartbeat|metrics)$ {
        proxy_pass http://membrane_backend;
        access_log off;
    }

    # Default — proxy to the application.
    location / {
        proxy_pass         http://membrane_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}
