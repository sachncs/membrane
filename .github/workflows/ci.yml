name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly run catches breakage from new upstream dependency releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # One run per ref; a new push to a PR cancels the outdated run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version-file: .python-version
          activate-environment: true
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: ruff check
        run: ruff check --output-format=github membrane/ tests/ scripts/ examples/
      - name: ruff format
        run: ruff format --check membrane/ tests/ scripts/ examples/
      - name: mypy
        run: mypy membrane/
      # No semi-private names, __all__ everywhere, no direct console output.
      - name: naming and output conventions
        run: python tools/check_naming.py
      # Every module, class, and function has a complete Google docstring.
      - name: docstrings
        run: python tools/check_docstrings.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version-file: .python-version
          activate-environment: true
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: pytest
        run: >-
          pytest tests/ -m "not stress and not chaos" --timeout=300 -q
          --cov=membrane --cov-report=term-missing:skip-covered --cov-report=xml
          --cov-fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  integration:
    name: Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version-file: .python-version
          activate-environment: true
          enable-cache: true
      - run: uv sync --frozen --extra dev
      # The Redis tests skip when no server answers; fail here instead
      # so this job cannot pass vacuously.
      - name: Verify Redis is reachable
        run: python -c "from membrane.persistence.redis import Redis; assert Redis().ping(), 'redis unreachable'"
      - run: pytest tests/membrane/persistence -q --timeout=300

  extended:
    name: Stress, chaos & bench smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version-file: .python-version
          activate-environment: true
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Stress (64-thread)
        run: pytest tests/membrane/stress -m stress -q --timeout=600
      - name: Chaos (in-process proxy; toxiproxy tests skip without a server)
        run: pytest tests/membrane/chaos -m chaos -q --timeout=600
      - name: Benchmark smoke
        run: pytest tests/bench -q --timeout=600

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans history
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version-file: .python-version
          activate-environment: true
          enable-cache: true
      # Audit exactly what the server image ships: the hash-pinned
      # [server] dependency set exported from uv.lock.
      - name: pip-audit
        run: |
          uv export --frozen --extra server --no-emit-project --format requirements-txt > requirements-server.txt
          uvx pip-audit --strict --disable-pip --vulnerability-service osv -r requirements-server.txt
      - name: bandit (high severity)
        run: uvx bandit -q -r membrane/ -lll
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: site/node_modules

  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: membrane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Boot the image the way production does (read-only root, non-root,
      # API-key auth) and check probes, auth, and graceful shutdown.
      - name: Smoke test
        run: |
          set -euo pipefail
          mkdir -p secrets
          printf 'ci-key:ci:read,write\n' > secrets/api-keys
          chmod 644 secrets/api-keys
          if docker run --rm membrane:ci; then
            echo "::error::server started without authentication"; exit 1
          fi
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8080 \
            -v "$PWD/secrets:/run/secrets:ro" -e MEMBRANE_API_KEY_FILE=/run/secrets/api-keys membrane:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/livez && break; sleep 1; done
          curl -fsS localhost:8080/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/inventory)" = 401
          curl -fsS -H 'Authorization: Bearer ci-key' -H 'Content-Type: application/json' \
            -d '{"prompt_tokens":[1,2,3,4],"model_id":"ci"}' localhost:8080/prefill
          docker stop -t 20 smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0
      - name: Container logs
        if: always()
        run: docker logs smoke 2>&1 || true
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: membrane:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  site:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  links:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Offline mode checks relative links and anchors between files
      # without hitting the network, so the job never flakes.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments README.md CONTRIBUTING.md 'docs/**/*.md'
          fail: true

  ci-ok:
    # Single required status check for branch protection.
    name: CI passed
    if: always()
    needs: [lint, test, integration, extended, security, docker, site, links]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
