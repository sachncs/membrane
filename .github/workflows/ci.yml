name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check membrane/ tests/

      - name: Format check with ruff
        run: ruff format --check membrane/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check
        run: python -m mypy membrane/

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=300 --cov=membrane --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The Redis tests skip when no server answers; fail loudly here
      # instead so this job cannot pass vacuously.
      - name: Verify Redis is reachable
        run: python -c "from membrane.persistence.redis import Redis; assert Redis().ping(), 'redis unreachable'"

      - name: Run integration tests with Redis
        run: pytest tests/membrane/persistence -v --tb=short --timeout=300

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # pip-audit inspects the active environment, so install what the
      # server image ships before auditing it.
      # membrane itself is removed again because a local build is not
      # on PyPI, which --strict would treat as an audit failure.
      - name: Install runtime dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install ".[server]" pip-audit bandit
          pip uninstall -y membrane

      - name: pip-audit
        run: pip-audit --strict --vulnerability-service osv

      - name: bandit
        run: bandit -r membrane/ -lll

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run bench smoke
        run: pytest tests/bench/ -v --tb=short --timeout=600

  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run stress suite
        run: pytest tests/membrane/stress -v --tb=short --timeout=600 -m stress

  chaos:
    # A real toxiproxy is not available on github-hosted runners, so the
    # suite's TestToxiproxyIntegration class is skipped; the in-process
    # _FakeProxy suite still runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run chaos suite
        run: pytest tests/membrane/chaos -v --tb=short --timeout=600 -m chaos

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: membrane:ci

      # Boot the image the way production does (read-only root, non-root,
      # API-key auth) and check probes, auth, and graceful shutdown.
      - name: Smoke test container
        run: |
          set -euo pipefail
          mkdir -p secrets
          printf 'ci-key:ci:read,write\n' > secrets/api-keys
          chmod 644 secrets/api-keys
          if docker run --rm membrane:ci; then
            echo "server started without authentication" >&2; exit 1
          fi
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8080 \
            -v "$PWD/secrets:/run/secrets:ro" -e MEMBRANE_API_KEY_FILE=/run/secrets/api-keys membrane:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/livez && break; sleep 1; done
          curl -fsS localhost:8080/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/inventory)" = 401
          curl -fsS -H 'Authorization: Bearer ci-key' localhost:8080/inventory
          docker stop -t 20 smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "membrane:ci"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Smoke test logs
        if: always()
        run: docker logs smoke || true
