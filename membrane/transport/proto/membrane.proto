syntax = "proto3";

package membrane;

option go_package = "github.com/membrane/api";

// Membrane v2 RPC service. v1 (the pre-PayloadIdentity messages) is
// removed; clients must speak v2 or talk over HTTP/JSON instead.
//
// Field numbers are sparse on purpose: do not renumber fields once
// clients have shipped. New optional fields may be added with the
// next available number.
service Membrane {
  // Store a fragment on the remote node. When the store succeeds,
  // it returns the canonical content hash for downstream indexing.
  rpc StoreFragment(StoreRequest) returns (StoreResponse);
  // Retrieve a fragment by content hash. Returns ``found=false`` when
  // the fragment is absent so callers can short-circuit cleanly.
  rpc RetrieveFragment(RetrieveRequest) returns (RetrieveResponse);
  // Ask the remote node for its inventory digest (the
  // ``content_hash -> version_id`` map).
  rpc SyncInventory(InventoryRequest) returns (InventoryResponse);
  // Run prefill on the remote node and return the resulting
  // fragments (with payload bytes inline when the producer
  // populated them).
  rpc Prefill(PrefillRequest) returns (PrefillResponse);
  // Heartbeat: report node health back to the caller.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// FragmentMessage is the v2 wire shape carrying the full
// PayloadIdentity and the canonical payload bytes inline.
//
// Repeated ``int32``/``int64`` arrays of length 2 encode the
// (start, end) ranges; arrays of arbitrary length encode ``shape``.
//
// The ``schema_version`` field is at the head so a v2 reader can
// recognize and reject a v1 fragment (which lacked the field).
message FragmentMessage {
  int32 schema_version = 1;
  bytes payload_hash = 2;            // 32 bytes (sha256 of canonical frame payload)
  string model_id = 3;
  string model_revision = 4;
  string tokenizer_name = 5;
  string tokenizer_revision = 6;
  repeated int32 layer_range = 7;     // [start, end], inclusive
  repeated int32 head_range = 8;     // [start, end] OR [-1, -1] (all-heads sentinel)
  repeated int32 token_span = 9;     // [start, end], inclusive
  string dtype = 10;                 // "float16" | "bfloat16" | "float32" | "float64"
  repeated int64 shape = 11;         // tensor shape
  string payload_ref = 12;           // blob key in ContentStore; empty when metadata-only
  int64 payload_size = 13;           // canonical frame byte size
  bytes payload = 14;                // canonical frame bytes (empty when sent via separate stream)
  double ttl = 15;
  double reuse_score = 16;
  int32 version_id = 17;
}

message StoreRequest {
  FragmentMessage fragment = 1;
  string node_id = 2;
  bool is_primary = 3;
}

message StoreResponse {
  bool success = 1;
  string content_hash = 2;
  string error = 3;
}

message RetrieveRequest {
  string content_hash = 1;
  string node_id = 2;
}

message RetrieveResponse {
  FragmentMessage fragment = 1;
  bool found = 2;
  string error = 3;
}

message InventoryRequest {
  string node_id = 1;
}

message InventoryResponse {
  map<string, int32> digest = 1;
  string node_id = 2;
}

message PrefillRequest {
  repeated int32 prompt_tokens = 1;
  string model_id = 2;
  string node_id = 3;
}

message PrefillResponse {
  repeated FragmentMessage fragments = 1;
  double kv_size_mib = 2;
  double latency_seconds = 3;
  bool success = 4;
  string error = 5;
}

message HeartbeatRequest {
  string node_id = 1;
}

message HeartbeatResponse {
  string node_id = 1;
  double load = 2;
  int64 memory_used_bytes = 3;
  int64 memory_limit_bytes = 4;
  int32 fragment_count = 5;
  bool healthy = 6;
}
