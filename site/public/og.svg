<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0d"/>
      <stop offset="1" stop-color="#16161c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="700" ry="500" fill="url(#glow)"/>
  <ellipse cx="900" cy="500" rx="400" ry="300" fill="url(#glow2)"/>

  <!-- Logo mark -->
  <g transform="translate(80 80)">
    <rect width="80" height="80" rx="20" fill="#0d0d12" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <g transform="translate(16 16)">
      <path d="M24 0c-15.2 0-26 6.4-26 16 0 6.8 5.6 10.4 12.8 12.4-5.2 1.6-10.8 4-14.8 8-4 4-6 8.8-6 14.8 0 13.6 12.8 24.8 34 24.8s34-11.2 34-24.8c0-6-2-10.8-6-14.8-4-4-9.6-6.4-14.8-8 7.2-2 12.8-5.6 12.8-12.4 0-9.6-10.8-16-26-16Z" fill="url(#brand)"/>
      <path d="M24 12c10 0 16 3.6 16 8 0 4.8-6.8 8-16 8s-16-3.2-16-8c0-4.4 6-8 16-8Z" fill="url(#cap)" opacity="0.95"/>
      <path d="M24 32c13.2 0 22 4.8 22 10.8 0 6.4-9.6 11.2-22 11.2s-22-4.8-22-11.2c0-6 8.8-10.8 22-10.8Z" fill="url(#cap)" opacity="0.85"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="180" y="135" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="600" fill="#ffffff" letter-spacing="-1">Membrane</text>

  <!-- Eyebrow -->
  <text x="80" y="290" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#a78bfa" letter-spacing="2">GLOBAL  CONTEXTUAL  MEMORY  FABRIC</text>

  <!-- Headline -->
  <text x="80" y="370" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="600" fill="#ffffff" letter-spacing="-2.5">Distributed KV-cache,</text>
  <text x="80" y="450" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="600" letter-spacing="-2.5">
    <tspan>content-</tspan><tspan fill="url(#brand)">addressed</tspan><tspan>, ready to ship.</tspan>
  </text>

  <!-- Sub -->
  <text x="80" y="510" font-family="Inter, system-ui, sans-serif" font-size="22" fill="rgba(255,255,255,0.65)" letter-spacing="-0.2">Reference implementation of the Prefill-as-a-Service paper · MIT · Python 3.10+</text>

  <!-- Bottom row -->
  <g transform="translate(80 560)">
    <rect width="180" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="22" y="23" font-family="JetBrains Mono, monospace" font-size="14" fill="#5eead4">$</text>
    <text x="40" y="23" font-family="JetBrains Mono, monospace" font-size="14" fill="rgba(255,255,255,0.85)">pip install membrane</text>
  </g>
  <text x="290" y="583" font-family="Inter, system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.4)">github.com/sachncs/membrane</text>
</svg>
