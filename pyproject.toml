[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane"
version = "2.0.0"
description = "Membrane: Global Contextual Memory Fabric for cross-datacenter LLM serving."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sachin <sachncs@gmail.com>"},
]
keywords = ["llm", "inference", "serving", "disaggregation", "simulation", "kv-cache", "memory-fabric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.27.2",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/sachncs/membrane"
Repository = "https://github.com/sachncs/membrane"
Issues = "https://github.com/sachncs/membrane/issues"
Changelog = "https://github.com/sachncs/membrane/blob/master/CHANGELOG.md"
Documentation = "https://github.com/sachncs/membrane/tree/master/docs"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
    "redis>=8.1.0",
    "ruff>=0.16.5",
    # Server extras are needed at test-collection time because the
    # compute-backend tests import httpx and the integration /
    # transport tests import fastapi and grpcio.
    "grpcio>=1.83.1",
    "grpcio-tools>=1.83.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]
server = ["grpcio>=1.83.1", "grpcio-tools>=1.83.1", "redis>=8.1.0", "fastapi>=0.141.1", "uvicorn[standard]>=0.52.4", "httpx>=0.28.1", "pydantic>=2.13.5"]
gpu = ["torch>=2.13.0"]
local-llm = ["transformers>=5.16.1", "tokenizers>=0.23.1", "torch>=2.13.0", "sentencepiece>=0.2.2", "protobuf>=7.36.0"]
# LMCache is the v2.0+ canonical KV substrate. Optional install;
# operators opt in via `pip install membrane[lmcache]`. The exact
# pin is left to the deployment image so the protobuf <-> grpcio
# version conflict in 0.5.4 can be resolved in CI without
# breaking the existing `[server]` extras.
lmcache = ["lmcache>=0.5,<0.6"]
# Engine integrations for v2.0+. The pins are loose on purpose:
# the v2.0 release is the first one that targets the v0.10+
# vLLM KVConnector v1 surface, the SGLang radix-cache pool,
# and the TensorRT-LLM runtime; operators pin the exact
# version in their deployment image.
vllm = ["vllm>=0.10,<0.12"]
sglang = ["sglang>=0.4,<0.6"]
trtllm = ["tensorrt-llm>=0.20,<0.22"]
# Prefill / decode disaggregation surface (Phase 8). The
# REST surface is FastAPI-only; the gRPC surface additionally
# pulls in grpcio. Operators that only need one of the two
# surfaces can install the corresponding extra directly.
disagg = ["fastapi>=0.141.1", "uvicorn[standard]>=0.52.4", "grpcio>=1.83.1", "grpcio-tools>=1.83.1"]
# Convenience: every v2.0+ engine integration plus the
# disagg surface. Use for local end-to-end demos.
all = ["membrane[lmcache,vllm,sglang,trtllm,disagg]"]

[project.scripts]
membrane = "membrane.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["membrane*"]

[tool.isort]
profile = "black"

[tool.mypy]
exclude = ["membrane/transport/proto/", "membrane/wire/v3/wire_v3_pb2*.py"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "stress: 64-thread concurrent stress suite; gated by the dedicated 'stress' CI job",
    "chaos: toxiproxy-aware chaos suite; gated by the dedicated 'chaos' CI job",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["membrane/transport/proto/", "membrane/wire/v3/wire_v3_pb2*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "E402", "RUF002"]

[tool.ruff.lint.per-file-ignores]
# Generated gRPC stubs preserve the canonical PascalCase method names from
# the proto file; ignore N802 so ruff does not flag them.
"membrane/transport/proto/*.py" = ["N802"]
# gRPC servicer methods must keep their PascalCase names to match the
# proto-defined RPC names; the abstract base class generated by
# grpc_tools uses these names too.
"membrane/transport/grpc.py" = ["N802"]
# Same convention for the disagg gRPC servicer and the
# generated transfer_pb2 / transfer_pb2_grpc stubs.
"membrane/disagg/grpc.py" = ["N802"]
"membrane/disagg/transfer_pb2*.py" = ["N802"]
# serialization uses Union[...] aliases that ruff's UP007 prefers to
# be X | Y; the project still targets Python 3.10 where that rewrite
# requires from __future__ import annotations everywhere.
"membrane/serialization.py" = ["UP007"]
# Test files may import modules purely for their side effects (fixtures)
# and call callables whose return values are not always used.
"tests/**" = ["F401", "N802", "B007", "B905", "E741"]
