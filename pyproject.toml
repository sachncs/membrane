[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane"
version = "3.0.1"
description = "Membrane: Global Contextual Memory Fabric for cross-datacenter LLM serving."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sachin <sachncs@gmail.com>"},
]
keywords = ["llm", "inference", "serving", "disaggregation", "simulation", "kv-cache", "memory-fabric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.27.2",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/sachncs/membrane"
Repository = "https://github.com/sachncs/membrane"
Issues = "https://github.com/sachncs/membrane/issues"
Changelog = "https://github.com/sachncs/membrane/blob/master/CHANGELOG.md"
Documentation = "https://github.com/sachncs/membrane/tree/master/docs"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
    "redis>=8.1.0",
    "ruff>=0.16.10",
    # Server extras are needed at test-collection time because the
    # compute-backend tests import httpx and the integration /
    # transport tests import fastapi and grpcio.
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    # Optional runtime extras exercised by the test suite.
    "cryptography>=44.0.0",
    "numpy>=1.26.0",
    "lz4>=4.3.0",
    "hypothesis>=6.100.0",
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.3.0",
]
# Everything `membrane serve` needs, including TLS / encryption at rest.
server = ["redis>=8.1.0", "fastapi>=0.142.2", "uvicorn[standard]>=0.54.0", "httpx>=0.28.1", "pydantic>=2.13.5", "cryptography>=44.0.0"]
# KV transfer engine and quantization (membrane.transfer_engine, membrane.quantization).
# zstd comes from the standard library (compression.zstd, PEP 784).
transfer = ["numpy>=1.26.0", "lz4>=4.3.0"]
# Secret backends (membrane.secrets.*). Each pulls cryptography for envelope encryption.
secrets-aws = ["boto3>=1.34.0", "cryptography>=44.0.0"]
secrets-gcp = ["google-cloud-secret-manager>=2.20.0", "cryptography>=44.0.0"]
secrets-vault = ["hvac>=2.1.0", "cryptography>=44.0.0"]
tls-spiffe = ["spiffe>=0.2.0"]
# OpenTelemetry tracing (membrane.otel_tracer).
otel = ["opentelemetry-api>=1.25.0", "opentelemetry-sdk>=1.25.0", "opentelemetry-exporter-otlp-proto-grpc>=1.25.0"]
gpu = ["torch>=2.13.0"]
local-llm = ["transformers>=5.18.0", "tokenizers>=0.23.1", "torch>=2.13.0", "sentencepiece>=0.2.2", "protobuf>=7.36.2"]
# Serving engines (vLLM, SGLang, TensorRT-LLM) are not extras: they pin
# their own dependency stacks (vLLM caps fastapi below what the server
# needs) and do not all ship Python 3.14 wheels. Install the engine in its
# own environment; membrane.adapters imports it lazily.
# Prefill / decode disaggregation surface (Phase 8). The
# REST surface is FastAPI-only; the gRPC surface additionally
# pulls in grpcio. Operators that only need one of the two
# surfaces can install the corresponding extra directly.
disagg = ["fastapi>=0.142.2", "uvicorn[standard]>=0.54.0", "grpcio>=1.84.0", "grpcio-tools>=1.84.0"]

[project.scripts]
membrane = "membrane.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["membrane*"]

[tool.mypy]
python_version = "3.14"
# Overriding methods must say so (typing.override), so a renamed base
# method is a type error instead of a silently dead override.
enable_error_code = ["explicit-override"]
exclude = ["membrane/transport/proto/", "membrane/wire/v3/wire_v3_pb2*.py"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "stress: 64-thread concurrent stress suite; gated by the dedicated 'stress' CI job",
    "chaos: toxiproxy-aware chaos suite; gated by the dedicated 'chaos' CI job",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["membrane/transport/proto/", "membrane/wire/v3/wire_v3_pb2*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "E402", "RUF002"]

[tool.ruff.lint.per-file-ignores]
# Generated gRPC stubs preserve the canonical PascalCase method names from
# the proto file; ignore N802 so ruff does not flag them.
"membrane/transport/proto/*.py" = ["N802"]
# gRPC servicer methods must keep their PascalCase names to match the
# proto-defined RPC names; the abstract base class generated by
# grpc_tools uses these names too.
"membrane/transport/grpc.py" = ["N802"]
# Same convention for the disagg gRPC servicer and the
# generated transfer_pb2 / transfer_pb2_grpc stubs.
"membrane/disagg/grpc.py" = ["N802"]
"membrane/disagg/transfer_pb2*.py" = ["N802"]
# Test files may import modules purely for their side effects (fixtures)
# and call callables whose return values are not always used.
"tests/**" = ["F401", "N802", "B007", "B905", "E741"]
